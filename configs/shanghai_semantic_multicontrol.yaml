# EXPERIMENT - Shanghai City Drone (HYBRID: Semantic shuffle + Multi-ControlNet depth_zoe+canny, FreeU)
# Shanghai had the worst Multi-ControlNet regression (Warp 0.0228 vs 0.0184 baseline,
# CLIP 0.2905 vs 0.3065 baseline) - testing whether semantic grouping can claw back
# some of that loss while keeping the multi-controlnet detail.
video_name: "shanghai"
preprocess_name: 'depth_zoe-canny'

batch_size: 1
batch_size_vae: 1
cond_step_start: 0.0
controlnet_conditioning_scale: '1.0-1.0'
controlnet_guidance_end: 1.0
controlnet_guidance_start: 0.0
give_control_inversion: true

grid_size: 3
sample_size: 36
pad: 1
guidance_scale: 7.5
inversion_prompt: ''

is_ddim_inversion: true
is_shuffle: true
shuffle_mode: 'semantic'

negative_prompts: ""
num_inference_steps: 50
num_inversion_step: 50
positive_prompts: "A cinematic drone view of a futuristic cyberpunk city at night"
save_folder: 'shanghai_semantic_multicontrol'

use_freeu: true
seed: 0
model_id: 'None'
