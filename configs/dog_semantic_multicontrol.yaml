# EXPERIMENT - Dog Running (HYBRID: Semantic shuffle + Multi-ControlNet depth_zoe+canny, FreeU)
# Untested combination: dog showed the best Multi-ControlNet Warp Error (0.0500)
# AND a slight Semantic v1 improvement (0.0511 vs 0.0518 baseline) - testing whether
# combining both effects compounds the improvement.
video_name: "dog"
preprocess_name: 'depth_zoe-canny'

batch_size: 4
batch_size_vae: 1
cond_step_start: 0.0
controlnet_conditioning_scale: '1.0-1.0'
controlnet_guidance_end: 1.0
controlnet_guidance_start: 0.0
give_control_inversion: true

grid_size: 3
sample_size: 36
pad: 1
guidance_scale: 7.5
inversion_prompt: ''

is_ddim_inversion: true
is_shuffle: true
shuffle_mode: 'semantic'

negative_prompts: ""
num_inference_steps: 50
num_inversion_step: 50
positive_prompts: "An oil painting of a dog running through a sunlit green meadow"
save_folder: 'dog_semantic_multicontrol'

use_freeu: true
seed: 0
model_id: 'None'
